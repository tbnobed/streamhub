openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Social Playout Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: assets
    description: Media asset library
  - name: channels
    description: Broadcast channels
  - name: playlists
    description: Playlist management
  - name: liveInputs
    description: Live RTMP/SRT ingest inputs
  - name: destinations
    description: Output destinations
  - name: youtube
    description: YouTube Live integration
  - name: workers
    description: Worker node management
  - name: monitoring
    description: Stream monitoring and stats
  - name: logs
    description: Audit and event logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ASSETS
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List media assets
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create asset record (after upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found

    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetBody"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/stats:
    get:
      operationId: getAssetStats
      tags: [assets]
      summary: Asset library stats (count, total size, formats)
      responses:
        "200":
          description: Asset stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetStats"

  # CHANNELS
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List all channels
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a new channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get channel detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDetail"
        "404":
          description: Not found

    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /channels/{id}/start:
    post:
      operationId: startChannel
      tags: [channels]
      summary: Start channel broadcast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{id}/stop:
    post:
      operationId: stopChannel
      tags: [channels]
      summary: Stop channel broadcast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/{id}/switch-source:
    post:
      operationId: switchChannelSource
      tags: [channels]
      summary: Switch between playlist/live input/fallback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchSourceBody"
      responses:
        "200":
          description: Source switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"

  /channels/summary:
    get:
      operationId: getChannelsSummary
      tags: [channels]
      summary: Dashboard summary (on-air count, total destinations, active workers)
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsSummary"

  # PLAYLISTS
  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: List playlists
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"

  /playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get playlist with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "404":
          description: Not found

    patch:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"

    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /playlists/{id}/items:
    get:
      operationId: listPlaylistItems
      tags: [playlists]
      summary: List items in playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaylistItem"

    post:
      operationId: addPlaylistItem
      tags: [playlists]
      summary: Add item to playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlaylistItemBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItem"

  /playlists/{id}/items/{itemId}:
    delete:
      operationId: removePlaylistItem
      tags: [playlists]
      summary: Remove item from playlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /playlists/{id}/reorder:
    post:
      operationId: reorderPlaylistItems
      tags: [playlists]
      summary: Reorder playlist items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPlaylistBody"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaylistItem"

  # LIVE INPUTS
  /live-inputs:
    get:
      operationId: listLiveInputs
      tags: [liveInputs]
      summary: List live ingest inputs
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Live inputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveInput"
    post:
      operationId: createLiveInput
      tags: [liveInputs]
      summary: Create live input (generates stream key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveInputBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInput"

  /live-inputs/{id}:
    get:
      operationId: getLiveInput
      tags: [liveInputs]
      summary: Get live input detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInput"

    patch:
      operationId: updateLiveInput
      tags: [liveInputs]
      summary: Update live input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLiveInputBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInput"

    delete:
      operationId: deleteLiveInput
      tags: [liveInputs]
      summary: Delete live input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /live-inputs/{id}/regenerate-key:
    post:
      operationId: regenerateLiveInputKey
      tags: [liveInputs]
      summary: Regenerate stream key for live input
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInput"

  # DESTINATIONS
  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      summary: List output destinations
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      tags: [destinations]
      summary: Create destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  /destinations/{id}:
    get:
      operationId: getDestination
      tags: [destinations]
      summary: Get destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

    patch:
      operationId: updateDestination
      tags: [destinations]
      summary: Update destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDestinationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

    delete:
      operationId: deleteDestination
      tags: [destinations]
      summary: Delete destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /destinations/{id}/toggle:
    post:
      operationId: toggleDestination
      tags: [destinations]
      summary: Enable or disable a destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"

  # YOUTUBE
  /youtube/accounts:
    get:
      operationId: listYoutubeAccounts
      tags: [youtube]
      summary: List connected YouTube accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YoutubeAccount"

  /youtube/accounts/{id}:
    delete:
      operationId: deleteYoutubeAccount
      tags: [youtube]
      summary: Disconnect YouTube account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /youtube/auth-url:
    get:
      operationId: getYoutubeAuthUrl
      tags: [youtube]
      summary: Get YouTube OAuth URL for connecting account
      responses:
        "200":
          description: Auth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeAuthUrl"

  /youtube/broadcasts:
    get:
      operationId: listYoutubeBroadcasts
      tags: [youtube]
      summary: List YouTube broadcasts
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Broadcasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YoutubeBroadcast"

    post:
      operationId: createYoutubeBroadcast
      tags: [youtube]
      summary: Create YouTube Live broadcast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateYoutubeBroadcastBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeBroadcast"

  # WORKERS
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List worker nodes
      responses:
        "200":
          description: Workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerNode"

  /workers/heartbeat:
    post:
      operationId: workerHeartbeat
      tags: [workers]
      summary: Worker sends heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatBody"
      responses:
        "200":
          description: OK

  /workers/jobs:
    get:
      operationId: fetchWorkerJobs
      tags: [workers]
      summary: Worker fetches assigned jobs
      parameters:
        - name: workerId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayoutJob"

  /workers/jobs/{id}/status:
    post:
      operationId: updateJobStatus
      tags: [workers]
      summary: Worker updates job status/metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobStatusBody"
      responses:
        "200":
          description: Updated

  /workers/events:
    post:
      operationId: submitWorkerEvent
      tags: [workers]
      summary: Worker submits an event log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerEventBody"
      responses:
        "201":
          description: Submitted

  # MONITORING
  /monitoring/stream-health:
    get:
      operationId: getStreamHealth
      tags: [monitoring]
      summary: Live stream health metrics for all active channels
      responses:
        "200":
          description: Stream health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamHealth"

  /monitoring/sessions:
    get:
      operationId: listStreamSessions
      tags: [monitoring]
      summary: List stream sessions history
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamSession"

  # LOGS
  /logs/audit:
    get:
      operationId: listAuditLogs
      tags: [logs]
      summary: List audit log entries
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /logs/worker-events:
    get:
      operationId: listWorkerEvents
      tags: [logs]
      summary: List worker event logs
      parameters:
        - name: channelId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Worker events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerEvent"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # AUTH
    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    # USER
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
