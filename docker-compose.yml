version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-playout}
      POSTGRES_USER: ${PGUSER:-playout}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-playout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${PGUSER:-playout}:${PGPASSWORD}@postgres:5432/${PGDATABASE:-playout}
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379
      INGEST_HOST: ${INGEST_HOST:-ingest.yourdomain.com}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
    ports:
      - "3001:3001"
    volumes:
      - media_storage:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:3001/api
      WORKER_ID: ${WORKER_ID:-worker-01}
      HOSTNAME: ${HOSTNAME:-worker-host}
      HEARTBEAT_INTERVAL: 15000
      JOB_POLL_INTERVAL: 5000
    volumes:
      - media_storage:/media
    deploy:
      replicas: 1

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs

volumes:
  postgres_data:
  redis_data:
  media_storage:
  nginx_certs:
