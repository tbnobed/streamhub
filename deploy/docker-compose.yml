version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playout}
      POSTGRES_USER: ${POSTGRES_USER:-playout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playout}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - playout

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-playout}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-playout}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      INGEST_HOST: ${INGEST_HOST:-ingest.yourdomain.com}
      SRS_API_URL: ${SRS_API_URL:-http://localhost:1985}
      SRT_INGEST_PORT: ${SRT_INGEST_PORT:-10080}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
      - preview:/tmp/preview
    networks:
      - playout

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-80}:80"
    networks:
      - playout

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api
      WORKER_ID: ${WORKER_ID:-worker-1}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads:ro
      - preview:/tmp/preview
    networks:
      - playout

volumes:
  pgdata:
  uploads:
  preview:

networks:
  playout:
    driver: bridge
